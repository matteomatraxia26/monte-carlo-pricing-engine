[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-pricer"
version = "0.17.0"
description = "Monte Carlo pricing, variance reduction and Greeks with reproducible numerical research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
research = ["pandas>=2.1", "matplotlib>=3.8"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
